<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodPanda</title>

<body>
    <div class="hero">

        <div class="btn"><button>1 Reguired</button></div>

    <p class="two">Select</p>

    <div class="radio-btn-3">

            <input type="radio" name="food"> Chicken Fajita <br><br>
        </div>
        <p class="p">Rs.0.00</p>

    <div class="radio-btn-4">
        <div>

        <p class="p">Rs.0.00</p>

    <div class="radio-btn-4">
        <div>
            <input type="radio" name="food"> Mountain drew
        </div>
        <p class="p">Rs.0.00</p>
    </div>

    <div class="parent">
        <div class="negative"><i class="fa-solid fa-minus"></i></div>
        <div class="num">1</div>
        <div class="possitive"><i class="fa-solid fa-plus"></i></div>
        <div class="butn">
            <button>Add to cart</button>
        </div>
    </div>

</html>
